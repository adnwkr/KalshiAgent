name: Kalshi relay (NFL + NBA + PGA)

# Pulls Kalshi's public NFL, NBA and PGA market data and commits snapshots to nfl-kalshi/data/,
# nba-kalshi/data/ and pga-kalshi/data/ so the betting agent (which can read GitHub but not Kalshi) has live lines.
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch:
    inputs:
      force_odds:
        description: "Also pull sportsbook odds now (3 credits each for NFL and NBA, 1 per major for PGA)"
        type: boolean
        default: false
      backfill_seasons:
        description: "Rebuild NBA and PGA results history for this many past seasons (0 = no, 5 for first setup)"
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: nfl-kalshi
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Kalshi markets
        id: fetch
        run: |
          set +e
          worst=0
          for lg in nfl nba; do
            log=$lg-kalshi/data/last_run.log
            mkdir -p $lg-kalshi/data
            python nfl-kalshi/fetch_kalshi.py $lg > $log 2>&1
            code=$?
            echo "exit_code=$code" >> $log
            date -u +"finished=%Y-%m-%dT%H:%M:%SZ" >> $log
            cat $log
            [ $code -ne 0 ] && worst=$code
          done
          log=pga-kalshi/data/last_run.log
          mkdir -p pga-kalshi/data
          python pga-kalshi/fetch_pga.py > $log 2>&1
          code=$?
          echo "exit_code=$code" >> $log
          date -u +"finished=%Y-%m-%dT%H:%M:%SZ" >> $log
          cat $log
          [ $code -ne 0 ] && worst=$code
          echo "code=$worst" >> "$GITHUB_OUTPUT"
      - name: Fetch NBA and PGA results (ESPN)
        env:
          BACKFILL: ${{ inputs.backfill_seasons }}
        run: |
          # Game and round results for the NBA and PGA models. Every run refreshes recent NBA games
          # and this week's golf event; the daily run rebuilds the current golf season.
          hr=$(date -u +%H)
          nba_args=""; pga_args=""
          [ "$hr" = "12" ] && pga_args="--daily"
          if [ -n "$BACKFILL" ] && [ "$BACKFILL" != "0" ]; then
            nba_args="--backfill $BACKFILL"; pga_args="--backfill $BACKFILL"
          fi
          python nba-kalshi/fetch_results.py $nba_args >> nba-kalshi/data/last_run.log 2>&1 || echo "results_exit=$?" >> nba-kalshi/data/last_run.log
          python pga-kalshi/fetch_results.py $pga_args >> pga-kalshi/data/last_run.log 2>&1 || echo "results_exit=$?" >> pga-kalshi/data/last_run.log
          grep -h "results" nba-kalshi/data/last_run.log pga-kalshi/data/last_run.log | tail -12
      - name: Fetch sportsbook odds (The Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE_ODDS: ${{ inputs.force_odds }}
        run: |
          # Spend credits only at chosen UTC times (runs land at :17 every 2 hours):
          # daily 12 (morning lines); Thu 22 (TNF close); Sun 16 and 20 (1pm and 4pm ET closes);
          # Mon 00 (SNF close); Tue 00 (MNF close). About 12 pulls a week, ~160 credits a month.
          dow=$(date -u +%u); hr=$(date -u +%H)
          run=no
          [ "$hr" = "12" ] && run=yes
          [ "$dow" = "4" ] && [ "$hr" = "22" ] && run=yes
          [ "$dow" = "7" ] && { [ "$hr" = "16" ] || [ "$hr" = "20" ]; } && run=yes
          { [ "$dow" = "1" ] || [ "$dow" = "2" ]; } && [ "$hr" = "00" ] && run=yes
          [ "$FORCE_ODDS" = "true" ] && run=yes
          if [ "$run" = "yes" ]; then
            python nfl-kalshi/fetch_odds.py nfl >> nfl-kalshi/data/last_run.log 2>&1 || echo "odds_exit=$?" >> nfl-kalshi/data/last_run.log
          else
            echo "odds: not a scheduled pull time (dow=$dow hr=$hr)" >> nfl-kalshi/data/last_run.log
          fi
          tail -2 nfl-kalshi/data/last_run.log

          # NBA: twice a day during the season (Oct through Jun): UTC 16 (late-morning lines)
          # and UTC 22 (close to the 7pm ET tips). About 60 pulls a month, ~180 credits.
          mon=$(date -u +%m)
          nba=no
          case "$mon" in 07|08|09) ;; *) { [ "$hr" = "16" ] || [ "$hr" = "22" ]; } && nba=yes ;; esac
          [ "$FORCE_ODDS" = "true" ] && nba=yes
          if [ "$nba" = "yes" ]; then
            python nfl-kalshi/fetch_odds.py nba >> nba-kalshi/data/last_run.log 2>&1 || echo "odds_exit=$?" >> nba-kalshi/data/last_run.log
          else
            echo "odds: not a scheduled pull time (mon=$mon hr=$hr)" >> nba-kalshi/data/last_run.log
          fi
          tail -2 nba-kalshi/data/last_run.log

          # PGA: The Odds API only has the four majors (winner market). Once a day at UTC 12 the
          # script looks up each major's start date (free) and pulls winner odds only if one starts
          # within 7 days or is in progress. About 30 credits a year.
          if [ "$FORCE_ODDS" = "true" ]; then
            python pga-kalshi/fetch_pga.py --odds-only --force >> pga-kalshi/data/last_run.log 2>&1 || echo "odds_exit=$?" >> pga-kalshi/data/last_run.log
          elif [ "$hr" = "12" ]; then
            python pga-kalshi/fetch_pga.py --odds-only >> pga-kalshi/data/last_run.log 2>&1 || echo "odds_exit=$?" >> pga-kalshi/data/last_run.log
          else
            echo "odds pga: not a scheduled check time (hr=$hr)" >> pga-kalshi/data/last_run.log
          fi
          tail -2 pga-kalshi/data/last_run.log
      - name: Commit snapshot
        run: |
          git config user.name "nfl-kalshi-relay"
          git config user.email "actions@users.noreply.github.com"
          git add nfl-kalshi/data nba-kalshi/data pga-kalshi/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Kalshi snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Fail if fetch failed
        if: steps.fetch.outputs.code != '0'
        run: exit 1
