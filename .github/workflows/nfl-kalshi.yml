name: Kalshi relay (NFL + NBA + PGA)

# Pulls Kalshi's public NFL, NBA and PGA market data and commits snapshots to nfl-kalshi/data/,
# nba-kalshi/data/ and pga-kalshi/data/ so the betting agent (which can read GitHub but not Kalshi) has live lines.
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC)
    - cron: "47 0,12,16,20,22 * * *"   # backup shots at the odds slot hours, in case GitHub skips the :17 run
  workflow_dispatch:
    inputs:
      force_odds:
        description: "Also pull sportsbook odds now (3 credits each for NFL and NBA, 1 per major for PGA)"
        type: boolean
        default: false
      closes:
        description: "Closing prices to look up: comma-separated TICKER@ISO-start-time (used by the grading runs for CLV)"
        type: string
        default: ""
      backfill_seasons:
        description: "Rebuild NBA and PGA results history for this many past seasons (0 = no, 5 for first setup)"
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: nfl-kalshi
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Kalshi markets
        id: fetch
        run: |
          set +e
          worst=0
          for lg in nfl nba; do
            log=$lg-kalshi/data/last_run.log
            mkdir -p $lg-kalshi/data
            python nfl-kalshi/fetch_kalshi.py $lg > $log 2>&1
            code=$?
            echo "exit_code=$code" >> $log
            date -u +"finished=%Y-%m-%dT%H:%M:%SZ" >> $log
            cat $log
            [ $code -ne 0 ] && worst=$code
          done
          log=pga-kalshi/data/last_run.log
          mkdir -p pga-kalshi/data
          python pga-kalshi/fetch_pga.py > $log 2>&1
          code=$?
          echo "exit_code=$code" >> $log
          date -u +"finished=%Y-%m-%dT%H:%M:%SZ" >> $log
          cat $log
          [ $code -ne 0 ] && worst=$code
          echo "code=$worst" >> "$GITHUB_OUTPUT"
      - name: Look up closing prices (Kalshi candlesticks)
        if: ${{ inputs.closes != '' && inputs.closes != null }}
        env:
          CLOSES: ${{ inputs.closes }}
        run: python common/kalshi_close.py "$CLOSES"
      - name: Fetch NBA and PGA results (ESPN)
        env:
          BACKFILL: ${{ inputs.backfill_seasons }}
        run: |
          # Game and round results for the NBA and PGA models. Every run refreshes recent NBA games
          # and this week's golf event; the daily run rebuilds the current golf season.
          # The golf season rebuild runs once per daily PGA slot (12 UTC, caught up if skipped);
          # the odds step below marks the slot as handled.
          nba_args=""; pga_args=""
          [ "$(python3 nfl-kalshi/odds_due.py pga)" = "yes" ] && pga_args="--daily"
          if [ -n "$BACKFILL" ] && [ "$BACKFILL" != "0" ]; then
            nba_args="--backfill $BACKFILL"; pga_args="--backfill $BACKFILL"
          fi
          python nba-kalshi/fetch_results.py $nba_args >> nba-kalshi/data/last_run.log 2>&1 || echo "results_exit=$?" >> nba-kalshi/data/last_run.log
          python pga-kalshi/fetch_results.py $pga_args >> pga-kalshi/data/last_run.log 2>&1 || echo "results_exit=$?" >> pga-kalshi/data/last_run.log
          grep -h "results" nba-kalshi/data/last_run.log pga-kalshi/data/last_run.log | tail -12
      - name: Fetch sportsbook odds (The Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE_ODDS: ${{ inputs.force_odds }}
        run: |
          # Spend credits only at chosen UTC slots (see nfl-kalshi/odds_due.py for the list).
          # GitHub often skips or delays cron runs, so odds_due.py catches up: a slot that was
          # missed is pulled by the next run inside that slot's window, and each slot at most once.
          # NFL: daily 12 (morning lines); Thu 22 (TNF close); Sun 16 and 20 (1pm and 4pm ET closes);
          # Mon 00 (SNF close); Tue 00 (MNF close). About 12 pulls a week, ~160 credits a month.
          # NBA (Oct through Jun): 16 (late-morning lines) and 22 (close to 7pm ET tips), ~180 credits a month.
          # PGA: daily 12 majors check (free lookup; pulls winner odds only near a major), ~30 credits a year.
          for lg in nfl nba; do
            log=$lg-kalshi/data/last_run.log
            due=$(python3 nfl-kalshi/odds_due.py $lg)
            if [ "$FORCE_ODDS" = "true" ] || [ "$due" = "yes" ]; then
              python nfl-kalshi/fetch_odds.py $lg >> $log 2>&1 || echo "odds_exit=$?" >> $log
              python3 nfl-kalshi/odds_due.py $lg --mark
            else
              echo "odds: no pull due ($(date -u +%Y-%m-%dT%H:%MZ))" >> $log
            fi
            tail -2 $log
          done

          log=pga-kalshi/data/last_run.log
          if [ "$FORCE_ODDS" = "true" ]; then
            python pga-kalshi/fetch_pga.py --odds-only --force >> $log 2>&1 || echo "odds_exit=$?" >> $log
            python3 nfl-kalshi/odds_due.py pga --mark
          elif [ "$(python3 nfl-kalshi/odds_due.py pga)" = "yes" ]; then
            python pga-kalshi/fetch_pga.py --odds-only >> $log 2>&1 || echo "odds_exit=$?" >> $log
            python3 nfl-kalshi/odds_due.py pga --mark
          else
            echo "odds pga: no check due ($(date -u +%Y-%m-%dT%H:%MZ))" >> $log
          fi
          tail -2 $log
      - name: Commit snapshot
        run: |
          git config user.name "nfl-kalshi-relay"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p closes
          git add nfl-kalshi/data nba-kalshi/data pga-kalshi/data closes
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Kalshi snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Fail if fetch failed
        if: steps.fetch.outputs.code != '0'
        run: exit 1
